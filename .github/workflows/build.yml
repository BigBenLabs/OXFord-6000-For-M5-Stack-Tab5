name: Build firmware

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.4
    env:
      # ESP-WiFi-Remote 0.8.5 selects its Kconfig files by IDF major/minor.
      ESP_IDF_VERSION: "5.5"
      # Use the locked dependencies without querying incompatible old metadata.
      IDF_COMPONENT_CHECK_NEW_VERSION: "0"
    steps:
      - uses: actions/checkout@v5
      - name: Build Tab5 firmware
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          cd firmware
          idf.py set-target esp32p4
          idf.py build
      - uses: actions/upload-artifact@v7
        with:
          name: tab5-fsrs-firmware
          path: |
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/tab5_fsrs.bin

